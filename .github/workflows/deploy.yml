name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize builds and deployment so an older run cannot replace a newer release.
concurrency:
  group: production-allinone
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  images:
    name: Build ${{ matrix.image }} image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: Production
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            context: .
            dockerfile: Dockerfile.server
          - image: frontend
            context: .
            dockerfile: Dockerfile.frontend
          - image: discord-bot
            context: ./discord-bot
            dockerfile: discord-bot/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image prefix
        id: image
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Keep the droplet's existing env file as the source of build-time values.
      # It stays outside the build context and is passed only as a BuildKit secret.
      - name: Read frontend build environment from droplet
        if: matrix.image == 'frontend'
        env:
          DO_HOST: ${{ secrets.DO_PROD_HOST }}
          DO_USER: ${{ secrets.DO_PROD_USER }}
          DO_SSH_KEY: ${{ secrets.DO_PROD_SSH_KEY }}
          APP_DIR: ${{ secrets.DO_PROD_APP_DIR }}
        run: |
          set -euo pipefail
          : "${DO_HOST:?Missing DO_PROD_HOST}" "${DO_USER:?Missing DO_PROD_USER}"
          : "${DO_SSH_KEY:?Missing DO_PROD_SSH_KEY}" "${APP_DIR:?Missing DO_PROD_APP_DIR}"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DO_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          ssh-keyscan -H "$DO_HOST" >> ~/.ssh/known_hosts
          printf -v remote_command 'cat -- %q' "$APP_DIR/.env.frontend"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DO_USER@$DO_HOST" "$remote_command" > "$RUNNER_TEMP/frontend.env"
          test -s "$RUNNER_TEMP/frontend.env"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.prefix }}-${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          # Secret contents do not invalidate Docker's cache. Rebuild Next.js
          # on every run so edits to .env.frontend take effect, even on a rerun.
          no-cache-filters: ${{ matrix.image == 'frontend' && 'frontend-build' || '' }}
          secret-files: ${{ matrix.image == 'frontend' && format('frontend_env={0}/frontend.env', runner.temp) || '' }}

      - name: Remove temporary frontend credentials
        if: always() && matrix.image == 'frontend'
        run: rm -f "$RUNNER_TEMP/frontend.env" ~/.ssh/id_rsa

  deploy:
    name: Start all-in-one stack on DigitalOcean
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    permissions:
      contents: read
      packages: read
    env:
      DO_HOST: ${{ secrets.DO_PROD_HOST }}
      DO_USER: ${{ secrets.DO_PROD_USER }}
      DO_SSH_KEY: ${{ secrets.DO_PROD_SSH_KEY }}
      APP_DIR: ${{ secrets.DO_PROD_APP_DIR }}
      REGISTRY_USER: ${{ github.actor }}
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      WS_HEALTH_URL: ${{ vars.WS_HEALTH_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          set -euo pipefail
          : "${DO_HOST:?Missing DO_PROD_HOST}" "${DO_USER:?Missing DO_PROD_USER}"
          : "${DO_SSH_KEY:?Missing DO_PROD_SSH_KEY}" "${APP_DIR:?Missing DO_PROD_APP_DIR}"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DO_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          ssh-keyscan -H "$DO_HOST" >> ~/.ssh/known_hosts

      - name: Pull images and start stack
        run: |
          set -euo pipefail
          # Send values on SSH stdin, with shell quoting, instead of exposing
          # the registry token in the remote command's process arguments.
          {
            printf 'export APP_DIR=%q\n' "$APP_DIR"
            printf 'export IMAGE_PREFIX=%q\n' "ghcr.io/${GITHUB_REPOSITORY,,}"
            printf 'export IMAGE_TAG=%q\n' "$GITHUB_SHA"
            printf 'export REGISTRY_USER=%q\n' "$REGISTRY_USER"
            printf 'export REGISTRY_PASSWORD=%q\n' "$REGISTRY_PASSWORD"
            printf 'export WS_HEALTH_URL=%q\n' "$WS_HEALTH_URL"
            cat scripts/deploy-allinone.sh
          } | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DO_USER@$DO_HOST" bash -s

      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/id_rsa
